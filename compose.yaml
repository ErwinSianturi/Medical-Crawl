services:
  crawler:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: medical-crawler
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - TZ=Asia/Jakarta
    volumes:
      - crawler_output:/app/output
      - crawler_data:/app/data
      - crawler_images:/app/gambar
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  crawler_output:
    name: medical_crawler_output
  crawler_data:
    name: medical_crawler_data
  crawler_images:
    name: medical_crawler_images