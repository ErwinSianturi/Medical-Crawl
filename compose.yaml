services:
  crawler:
    image: medical-crawler:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-crawler
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:8081"
    environment:
      - PORT=8081
      - TZ=Asia/Jakarta
    volumes:
      - crawler_output:/app/output
      - crawler_data:/app/data
      - crawler_images:/app/gambar
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/api/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  crawler_output:
    name: medical_crawler_output
  crawler_data:
    name: medical_crawler_data
  crawler_images:
    name: medical_crawler_images